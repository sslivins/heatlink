name: host-tests

on:
  push:
    branches: [main]
    paths:
      - 'components/hvac_mqtt/hvac_topics.cpp'
      - 'components/hvac_mqtt/include/hvac_topics.h'
      - 'components/hvac_group/group_proto.cpp'
      - 'components/hvac_group/include/group_proto.h'
      - 'components/cn105/**'
      - 'components/park/**'
      - 'components/autorange/**'
      - 'components/slice/**'
      - 'components/history/**'
      - 'components/room_sensor/**'
      - 'components/tokens/**'
      - 'components/roam/**'
      - 'test/host/**'
      - 'test/ui/**'
      - 'test/api/**'
      - 'test/run_all.mjs'
      - 'main/web/index.html'
      - 'main/web_ui.cpp'
      - 'openapi.yaml'
      - '.github/workflows/host-tests.yml'
  # No path filter on PRs: this is a required check, so it must always report.
  pull_request:
    branches: [main]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run host unit tests
        shell: bash
        run: |
          g++ -std=c++17 -Wall -Wextra \
            -I components/hvac_mqtt/include \
            components/hvac_mqtt/hvac_topics.cpp \
            test/host/test_hvac_topics.cpp \
            -o host_tests
          ./host_tests

      - name: Build and run host group-protocol tests
        shell: bash
        run: |
          g++ -std=c++17 -Wall -Wextra \
            -I components/hvac_group/include \
            components/hvac_group/group_proto.cpp \
            test/host/test_group_proto.cpp \
            -o group_tests
          ./group_tests

      - name: Build and run host CN105 codec tests
        shell: bash
        run: |
          g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined \
            -I components/cn105/include \
            components/cn105/cn105_codec.cpp \
            test/host/test_cn105_codec.cpp \
            -o cn105_codec_tests
          ./cn105_codec_tests

      - name: Build and run host park-logic tests
        shell: bash
        run: |
          g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined \
            -I components/park/include \
            components/park/park_logic.cpp \
            test/host/test_park_logic.cpp \
            -o park_tests
          ./park_tests

      - name: Build and run host auto-range tests
        shell: bash
        run: |
          g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined \
            -I components/autorange/include \
            components/autorange/auto_logic.cpp \
            test/host/test_auto_logic.cpp \
            -o auto_tests
          ./auto_tests

      - name: Build and run host time-slice tests
        shell: bash
        run: |
          g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined \
            -I components/slice/include \
            components/slice/slice_logic.cpp \
            test/host/test_slice_logic.cpp \
            -o slice_tests
          ./slice_tests

      - name: Build and run host history tests
        shell: bash
        run: |
          g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined \
            -I components/history/include \
            components/history/history_logic.cpp \
            test/host/test_history.cpp \
            -o history_tests
          ./history_tests

      - name: Build and run host room-sensor tests
        shell: bash
        run: |
          g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined \
            -I components/room_sensor/include \
            components/room_sensor/bthome.cpp \
            components/room_sensor/sensor_set.cpp \
            components/room_sensor/shelly_ht.cpp \
            test/host/test_room_sensor.cpp \
            -o room_sensor_tests
          ./room_sensor_tests

      - name: Build and run host integration-token tests
        shell: bash
        run: |
          g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined \
            -I components/tokens/include \
            components/tokens/token_logic.cpp \
            test/host/test_token_logic.cpp \
            -o token_tests
          ./token_tests

      - name: Build and run host roaming-policy tests
        shell: bash
        run: |
          g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined \
            -I components/roam/include \
            components/roam/roam_logic.cpp \
            test/host/test_roam_logic.cpp \
            -o roam_tests
          ./roam_tests

      - name: Run Node host tests (web UI + API contract)
        shell: bash
        run: node test/run_all.mjs

      - name: Check openapi.yaml parses
        shell: bash
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --break-system-packages pyyaml
          python3 -c "import yaml; yaml.safe_load(open('openapi.yaml', encoding='utf-8')); print('openapi.yaml OK')"
