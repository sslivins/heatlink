openapi: 3.0.3
info:
  title: HeatLink Controller API
  description: |
    HTTP API exposed by the on-device web server of the
    [heatlink](https://github.com/sslivins/heatlink)
    ESP32-S3 firmware. The device bridges a Mitsubishi heat pump to Home
    Assistant over MQTT and serves a configuration dashboard plus this JSON API.

    ## Authentication
    When **API access** is enabled in the dashboard (Security tab), every
    `/api/*` request must carry a valid `X-API-Key` header **or** a logged-in
    browser session cookie. When API access is disabled, the endpoints are open
    on the local network. The API key is shown (and can be regenerated) in the
    dashboard's *API Access* card.

    Integrations should prefer a scoped **integration token**
    (`Authorization: Bearer hlt1_…`, see `/api/tokens`), which works regardless
    of the API-key toggle and can be revoked on its own. `GET /api/info` is
    public and reports the API version for discovery.
  version: 0.2.98
  license:
    name: See repository
    url: https://github.com/sslivins/heatlink
servers:
  - url: http://{host}
    description: The device on your local network
    variables:
      host:
        default: heatlink.local
        description: Device mDNS hostname or IP address
tags:
  - name: Climate
    description: Heat-pump state and control
  - name: Status
    description: Device health and telemetry
  - name: Network
    description: WiFi and MQTT configuration
  - name: Firmware
    description: OTA updates
  - name: System
    description: Restart, factory reset
  - name: Auth
    description: Login, sessions and API-key management
  - name: Capabilities
    description: Detected feature support and user overrides
  - name: Activity
    description: On-device activity log
  - name: Groups
    description: Shared-compressor mode coordination between paired heads
  - name: House
    description: Read-only view of every head on the LAN across all outdoor units
paths:
  /api/status:
    get:
      tags: [Status]
      summary: Device health and power telemetry
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - SessionCookie: []
      responses:
        '200':
          description: Current device status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
  /api/settings:
    get:
      tags: [Climate]
      summary: Current heat-pump settings and live status
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - SessionCookie: []
      responses:
        '200':
          description: Heat-pump settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
    post:
      tags: [Climate]
      summary: Change heat-pump settings
      description: >-
        Only the fields present in the body are applied. Setting `mode` also
        turns the head on, unless the same body has `"power": "OFF"`; then the
        mode is stored and the head stays off.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsUpdate' }
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusOk' }
        '400':
          description: Empty, oversized or invalid JSON body
  /api/mqtt:
    get:
      tags: [Network]
      summary: Current MQTT broker settings (password masked)
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - SessionCookie: []
      responses:
        '200':
          description: MQTT settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MqttSettings' }
    post:
      tags: [Network]
      summary: Save MQTT broker settings, then reboot
      description: |
        Omitted fields keep their stored value (notably `password`, which the
        GET never returns). The device reboots after saving.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MqttSettingsUpdate' }
      responses:
        '200':
          description: Saved; device rebooting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedRebooting' }
        '400':
          description: Missing host or invalid body
        '500':
          description: NVS write failed
  /api/wifi:
    get:
      tags: [Network]
      summary: Current WiFi network (password never returned)
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - SessionCookie: []
      responses:
        '200':
          description: WiFi state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WifiSettings' }
    post:
      tags: [Network]
      summary: Set WiFi credentials, then reboot
      description: Omitting/blanking `password` preserves the stored key.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WifiUpdate' }
      responses:
        '200':
          description: Saved; device rebooting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedRebooting' }
        '400':
          description: Missing ssid or invalid body
        '500':
          description: NVS write failed
  /api/update:
    get:
      tags: [Firmware]
      summary: Cached GitHub release-check result
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - SessionCookie: []
      responses:
        '200':
          description: Update info
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateInfo' }
  /api/update/check:
    post:
      tags: [Firmware]
      summary: Trigger an immediate GitHub release poll
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - SessionCookie: []
      responses:
        '200':
          description: Check started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: checking }
  /api/update/install:
    post:
      tags: [Firmware]
      summary: Install the latest GitHub release
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - SessionCookie: []
      responses:
        '200':
          description: Install started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartedStatus' }
        '409':
          description: No update available or OTA busy
  /api/diag/reset-brownout:
    post:
      tags: [Diagnostics]
      summary: Reset the cumulative brownout counter to zero
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - SessionCookie: []
      responses:
        '200':
          description: Counter reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /api/diag/reset-wifi-drops:
    post:
      tags: [Diagnostics]
      summary: Reset the session WiFi-drop counter to zero
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - SessionCookie: []
      responses:
        '200':
          description: Counter reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /api/diag/reset-vin-min:
    post:
      tags: [Diagnostics]
      summary: Clear the persisted all-time-low input voltage (vin_min_ever)
      description: Resets the NVS record low to 0; the next reading re-seeds it from the current rail. Use to clear a stale record left by a pre-plausibility-floor glitch.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - SessionCookie: []
      responses:
        '200':
          description: Record low reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /api/ota:
    post:
      tags: [Firmware]
      summary: Upload a raw firmware .bin into the inactive slot
      description: Streams the request body to the OTA partition; reboots on success.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Flashed; device rebooting
        '400':
          description: Upload interrupted
        '500':
          description: OTA busy, no partition, write or validation failure
  /api/ota/url:
    post:
      tags: [Firmware]
      summary: Pull firmware from a URL in the background
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
      responses:
        '200':
          description: Download started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartedStatus' }
        '400':
          description: Missing url or invalid body
        '409':
          description: OTA already busy
  /api/ota/status:
    get:
      tags: [Firmware]
      summary: Current OTA progress
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - SessionCookie: []
      responses:
        '200':
          description: OTA status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtaStatus' }
  /api/system/restart:
    post:
      tags: [System]
      summary: Reboot the device
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - SessionCookie: []
      responses:
        '200':
          description: Restarting
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: restarting }
  /api/system/factory_reset:
    post:
      tags: [System]
      summary: Factory reset — erase all stored config and reboot into provisioning
      description: >-
        Wipes the entire NVS partition (Wi-Fi credentials, MQTT broker settings,
        group membership, device name, and web/API passwords) and reboots into
        first-run provisioning (SoftAP). Admin only.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - SessionCookie: []
      responses:
        '200':
          description: Reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: reset }
  /api/login:
    post:
      tags: [Auth]
      summary: Log in and receive a session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: Logged in; `Set-Cookie` returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusOk' }
        '400':
          description: Invalid body
        '401':
          description: Invalid credentials
        '429':
          description: |
            Too many failed attempts (10 in a row locks logins for 30 s).
            Body: `{"error":"too many attempts","retry_after":<seconds>}`.
  /api/logout:
    post:
      tags: [Auth]
      summary: Invalidate the current session
      security:
        - BearerAuth: []
        - SessionCookie: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusOk' }
  /api/group/handoff:
    post:
      tags: [Auth]
      summary: Issue a one-time admin sign-in ticket for another head in the group
      description: |
        Admin only. The ticket (`issuer.target.exp.nonce.sig`, HMAC under a
        group-secret subkey) is valid for 60 s and is redeemed once with
        `POST /api/sso` on the target head.
      security:
        - SessionCookie: []
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uid]
              properties:
                uid: { type: string, description: Target member's uid }
      responses:
        '200':
          description: Ticket issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { type: string }
        '403':
          description: Not admin
        '404':
          description: uid is not a member of this head's group
        '409':
          description: This head isn't in a group
        '503':
          description: Clock not set (NTP), so the ticket can't carry an expiry
  /api/sso:
    post:
      tags: [Auth]
      summary: Redeem a sign-in ticket from another head in the group
      description: |
        No auth. On success an admin session is created and returned in
        `Set-Cookie`, replacing any climate-only session. Already-admin
        callers get 200 without a new session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket]
              properties:
                ticket: { type: string }
      responses:
        '200':
          description: 'Signed in as admin; `{"status":"ok","role":"admin"}`'
        '401':
          description: Ticket malformed, for another head, expired, already used or badly signed
        '429':
          description: Logins are locked after too many failed attempts
  /api/auth:
    get:
      tags: [Auth]
      summary: Auth configuration and whether this client is authenticated
      description: The `api_key` field is only included for an authenticated client.
      responses:
        '200':
          description: Auth state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthState' }
    post:
      tags: [Auth]
      summary: Update auth settings, or create the first admin password (claim)
      description: |
        Requires an admin session once an admin password exists. Only the
        fields present in the body are applied. Web login is always required
        once an admin password is set; `web_auth_enabled` is no longer settable.

        **Claim.** A head with no admin password is either `legacy` (upgraded
        from older firmware; UI open) or `unclaimed` (freshly provisioned;
        everything but the public auth endpoints is locked).
        `{"claim":true,"password":"…","token":"…"}` creates the admin password
        and returns an admin session cookie. On an unclaimed head the `token`
        must be the claim token from the setup portal link (`?claim=`). On a
        legacy head, setting `password` is itself a claim.

        **Reset window.** The admin password reset procedure opens a 15-minute
        window (`recovery_secs_left`) in which a claim needs no token and
        replaces any existing admin password; that also logs every session out
        and rotates the API key. If no claim is made, nothing changes.

        Changing the admin password logs every session out, then signs the
        caller back in (new cookie).
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthUpdate' }
      responses:
        '200':
          description: Updated; new `api_key` returned only when regenerated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthPostResult' }
        '400':
          description: Invalid body, or admin password empty / equal to the user password
        '401':
          description: Not authorized to change auth settings
        '403':
          description: Claim not allowed (wrong/missing token and no recovery window)
        '409':
          description: Claim attempted but an admin password is already set and no reset window is open
  /api/capabilities:
    get:
      tags: [Capabilities]
      summary: Detected feature support and user overrides
      description: Currently reports wide-vane support only.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - SessionCookie: []
      responses:
        '200':
          description: Capability snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capabilities' }
    post:
      tags: [Capabilities]
      summary: Set a capability override or trigger detection (admin only)
      description: |
        Set `override` to force the wide-vane control shown/hidden regardless of
        detection, and/or set `detect: true` to run an on-demand detection probe
        (briefly moves the vane).
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapabilitiesUpdate' }
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusOk' }
        '400':
          description: Empty, oversized or invalid JSON body
  /api/park:
    get:
      tags: [Climate]
      summary: Off-at-setpoint config and status
      description: |
        Mitsubishi heads keep the indoor fan running at thermo-off. With this
        feature on, a HEAT/COOL/DRY head that has reached its setpoint is powered
        off ("parked") while its desired state stays on (reported as power ON),
        and powered back on when the room drifts `delta_c` past the setpoint
        (after `min_off_s`) or a periodic probe run finds it needs conditioning.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - SessionCookie: []
      responses:
        '200':
          description: Current config and live status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParkConfig' }
    post:
      tags: [Climate]
      summary: Update off-at-setpoint config (admin)
      description: |
        Partial update; omitted fields keep their value. Out-of-range values are
        clamped: `delta_c` 0.5–3.0 in 0.5 steps, `min_off_s` 300–3600,
        `probe_interval_s` max(min_off_s)–7200, `probe_duration_s` 60–600.
        Disabling while parked powers the unit back on. In a zone group,
        `enabled`, `min_off_s` and the probe settings are the outdoor unit's:
        they are replicated to every head in the group (`delta_c` stays per head).
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParkConfigUpdate' }
      responses:
        '200':
          description: Applied (sanitized) config and live status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParkConfig' }
        '400':
          description: Empty, oversized or invalid JSON body
        '401':
          description: Not authorized
        '403':
          description: Admin access required
  /api/sensors:
    get:
      tags: [Climate]
      summary: Wireless room sensors (BTHome over Bluetooth, Shelly over Wi-Fi)
      description: |
        Up to `max` paired room sensors and their latest readings. While any is
        fresh, the average of the fresh sensors (`temp`) is sent to the unit as
        the remote room temperature (Home Assistant's `remote_temp/set` is
        ignored meanwhile) and off-at-setpoint uses it instead of air checks.
        A sensor is stale after `stale_after_s` without a temperature (10 min
        for Bluetooth, 2 h 15 min for Shelly Wi-Fi sensors, which sleep and
        report on change or at least every 2 h). With none fresh the remote
        temperature is cleared and the head uses its own sensor.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - SessionCookie: []
      responses:
        '200':
          description: Sensors, room temperature and pairing state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomSensors' }
    post:
      tags: [Climate]
      summary: Pair, configure or remove room sensors (admin)
      description: |
        - `pair_ble` opens a 60 s window: pressing the button on an unencrypted
          BTHome sensor pairs it. `select` pairs `addr` from the window's
          `nearby` list.
        - `discover` looks for awake Shelly sensors (mDNS) for 3 minutes;
          `pair_wifi` pairs the Shelly at `host` in the background (progress in
          `pairing.wifi.state`). Pairing installs webhooks on the sensor that
          call `/api/sensors/report`; the sensor must be awake (press its
          button) and have no password.
        - `cancel` closes the windows. `remove` unpairs `id`.
        - `set` renames `id` and/or sets a Shelly's `report_step` (°C change
          that triggers a report, 0.1–5.0). The sensor applies it when it
          next wakes (`pending`).
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [pair_ble, discover, pair_wifi, select, cancel, remove, set] }
                addr: { type: string, description: 'select: Bluetooth address, e.g. "7C:C6:B6:12:34:56"' }
                host: { type: string, description: 'pair_wifi: the sensor IP address or host name' }
                id: { type: string, description: 'remove / set: sensor id' }
                name: { type: string, description: 'set: display name' }
                report_step: { type: number, description: 'set: Shelly report threshold, °C' }
      responses:
        '200':
          description: Updated state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomSensors' }
        '400':
          description: Missing/unknown action, invalid value, already 4 sensors, or a pairing is in progress
        '401':
          description: Not authorized
        '403':
          description: Admin access required
        '404':
          description: No such sensor, or the selected Bluetooth sensor wasn't heard recently or is encrypted
  /api/sensors/report:
    get:
      tags: [Climate]
      summary: Webhook from a paired Shelly sensor
      description: |
        Called by the webhooks installed at pairing. No login: the per-sensor
        token `k` is the credential. The caller's IP becomes the sensor's
        address, so DHCP changes are followed.
      parameters:
        - { name: k, in: query, required: true, schema: { type: string }, description: Sensor token }
        - { name: t, in: query, schema: { type: number }, description: Temperature, °C }
        - { name: h, in: query, schema: { type: number }, description: 'Humidity, %RH' }
        - { name: b, in: query, schema: { type: integer }, description: 'Battery, %' }
        - { name: r, in: query, schema: { type: integer }, description: Wi-Fi RSSI, dBm }
      responses:
        '200':
          description: Accepted
        '400':
          description: Malformed report
        '403':
          description: Unknown token
  /api/device:
    post:
      tags: [System]
      summary: Set the device display name, temperature display unit, WiFi TX power and/or web UI language
      description: |
        Partial update — only the fields present are applied, so a `temp_unit`-only
        POST won't clear the display name (and vice versa). `temp_unit` controls
        the web UI display only. `tx_power` sets the WiFi transmit-power cap (dBm)
        and is applied to the live radio immediately, without a reboot. `lang`
        overrides the web UI language ("" = auto-detect from the browser), applied
        live without a reboot.
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceUpdate' }
      responses:
        '200':
          description: Canonical (sanitised) values after the update
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceResult' }
        '400':
          description: Empty, oversized or invalid JSON body
        '500':
          description: NVS write failed
  /api/scan:
    get:
      tags: [Network]
      summary: Scan for nearby WiFi networks (blocking)
      security:
        - BearerAuth: []
        - SessionCookie: []
      responses:
        '200':
          description: Networks found, strongest first, de-duplicated by SSID
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WifiNetwork' }
        '500':
          description: Scan failed
  /api/events:
    get:
      tags: [Activity]
      summary: Recent activity-log events (newest first)
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - name: since
          in: query
          description: Only return events with a `seq` greater than this value.
          schema: { type: integer, default: 0 }
        - name: limit
          in: query
          description: Maximum number of events to return (capped by the ring size).
          schema: { type: integer, default: 100 }
      responses:
        '200':
          description: Activity log page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventsResponse' }
    delete:
      tags: [Activity]
      summary: Clear the activity log
      security:
        - BearerAuth: []
        - SessionCookie: []
      responses:
        '200':
          description: Cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
  /api/logs:
    get:
      tags: [Activity]
      summary: Recent firmware log output (admin only, diagnostics)
      description: |
        The last ~16 KB of ESP_LOG output, oldest first. Lines are prefixed
        with the UTC time (`MM-DD HH:MM:SSZ`) once SNTP has synced. The buffer
        survives software, panic, watchdog and brownout restarts, each marked
        with a `=== restart (reason) ===` line; a power-on reset clears it.
        Not shown in the web UI.
      security:
        - BearerAuth: []
        - SessionCookie: []
      responses:
        '200':
          description: Log text
          content:
            text/plain:
              schema: { type: string }
    delete:
      tags: [Activity]
      summary: Clear the firmware log buffer
      security:
        - BearerAuth: []
        - SessionCookie: []
      responses:
        '200':
          description: Cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
  /api/history:
    get:
      tags: [Activity]
      summary: Recorded climate history (admin or climate-only user)
      description: |
        One sample every 30 s is kept on flash for 14 days. Windows longer
        than 4 h are averaged into `bucket`-second buckets (24 h → 60 s,
        7 d → 420 s, 14 d → 840 s). Temperatures are deci-°C; `null` = no
        reading. `flags` bits: 1 connected, 2 power, 4 operating, 8 defrost,
        16 parked. `mode`: 0 none, 1 heat, 2 cool, 3 dry, 4 fan, 5 auto.
        `fan`: 0 auto, 1 quiet, 2-5 speeds 1-4, 255 unknown. `freq` is the
        outdoor unit's compressor frequency (shared by every head).
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - name: window
          in: query
          description: Window length in seconds (3600 to 1209600).
          schema: { type: integer, default: 86400 }
        - name: end
          in: query
          description: Window end (unix seconds). Omit for the latest window.
          schema: { type: integer }
      responses:
        '200':
          description: History window
          content:
            application/json:
              schema:
                type: object
                properties:
                  clock_valid: { type: boolean }
                  now: { type: integer }
                  start: { type: integer }
                  end: { type: integer }
                  window: { type: integer }
                  interval: { type: integer, example: 30 }
                  bucket: { type: integer, example: 60 }
                  earliest: { type: integer, description: Oldest stored sample (0 if none) }
                  latest_end: { type: integer, description: End of the newest window }
                  fields:
                    type: array
                    items: { type: string }
                    example: [t, room, target, outdoor, sensor, freq, mode, flags, fan]
                  samples:
                    type: array
                    items:
                      type: array
                      items: { type: [integer, 'null'] }
        '403':
          description: Admin role required
  /api/group:
    get:
      tags: [Groups]
      summary: Group membership, self state, members and conflicts
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - SessionCookie: []
      responses:
        '200':
          description: Current group view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupView' }
  /api/group/state:
    get:
      tags: [Groups]
      summary: Peer state snapshot (device-to-device, HMAC-signed)
      description: |
        Machine-to-machine endpoint polled by group peers. Authenticated by the
        `X-Group-*` HMAC headers, not by an API key or session cookie. The
        response body is signed with an `X-Group-Sig` response header.
      parameters:
        - { name: X-Group-Sender, in: header, required: true, schema: { type: string } }
        - { name: X-Group-Id, in: header, required: true, schema: { type: string } }
        - { name: X-Group-Nonce, in: header, required: true, schema: { type: string } }
        - { name: X-Group-Sig, in: header, required: true, schema: { type: string } }
      responses:
        '200':
          description: Signed peer snapshot (replica state + protocol version)
          content:
            application/json:
              schema:
                type: object
                properties:
                  pv: { type: integer, description: Protocol version }
                  slice_v: { type: integer, description: Time-slicing version this head supports (absent on older firmware) }
                  sat: { type: boolean, description: Parked at setpoint (off-at-setpoint satisfied) }
                  slice:
                    type: object
                    description: Time-slice state this head holds (present only while slicing has state)
                    properties:
                      t: { type: integer, description: Coordinator term }
                      s: { type: integer, description: Sequence within the term }
                      m: { type: string, enum: [none, heat, cool] }
                      p: { type: string, enum: [idle, run, changeover] }
                      e: { type: integer, description: Seconds in the current phase }
                      c: { type: string, description: Coordinator uid }
                  adm:
                    type: object
                    description: Admin password sync (present when a password is set); a newer epoch is adopted by the poller
                    properties:
                      e: { type: integer, description: Admin password epoch }
                      s: { type: string, description: 'Password hash record, AES-256-GCM sealed under a key derived from the group secret' }
                additionalProperties: true
        '401':
          description: Invalid sender, nonce, group id or signature
        '403':
          description: Not in a group
  /api/group/join/params:
    get:
      tags: [Groups]
      summary: Admin-password verifier parameters and a join nonce (head to head)
      description: |
        Step 1 of a join, called by the joining head on the head it is joining.
        Unauthenticated: returns only the salt/iteration parameters of the admin
        password hash and a one-time nonce (valid 60 s).
      responses:
        '200':
          description: Parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  ver: { type: integer, description: 'Hash version (1 = SHA-256, 2 = PBKDF2-SHA256)' }
                  iters: { type: integer }
                  salt: { type: string, description: 16-byte salt, hex }
                  nonce: { type: string, description: 128-bit one-time nonce, hex }
                  uid: { type: string }
                  name: { type: string }
                  glabel: { type: string, description: Group label (absent when standalone) }
        '409':
          description: This head has no admin password (`no_admin_password`)
  /api/group/join/claim:
    post:
      tags: [Groups]
      summary: Prove the admin password and receive the sealed group (head to head)
      description: |
        Step 2 of a join. With K = the admin password hash under the parameters
        from `join/params`, `proof` = hex HMAC-SHA256(K, "hl-join1|nonce|cnonce|joiner_uid").
        No session needed: the proof is the credential, and failures count
        toward the login lockout. If this head is standalone it forms a group
        first. The reply is AES-256-GCM sealed under
        HMAC-SHA256(K, "hl-enc1|nonce|cnonce") and holds the group id, label,
        secret, members, replica, broker (when configured) and the admin
        password record (`adm`), which the joiner adopts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [joiner_uid, nonce, cnonce, proof]
              properties:
                joiner_uid: { type: string }
                joiner_name: { type: string }
                nonce: { type: string }
                cnonce: { type: string, description: Joiner's 128-bit random nonce, hex }
                proof: { type: string }
      responses:
        '200':
          description: Admitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  sealed: { type: string, description: 'hex(iv[12] || ciphertext || tag[16])' }
        '400':
          description: Malformed request
        '401':
          description: Wrong admin password
        '409':
          description: This head has no admin password
        '410':
          description: Unknown or expired nonce
        '429':
          description: Locked out after too many wrong passwords
  /api/group/join:
    post:
      tags: [Groups]
      summary: Join another head's outdoor-unit group with the admin password
      description: |
        Runs the join/params + join/claim exchange against `host`, adopts the
        group, and replaces this head's admin password with the group's. The
        response signs the browser in as admin (Set-Cookie). Allowed for an
        admin, or without signing in while the head is unclaimed (`token` = the
        setup claim token) or the admin-password reset window is open.
        Reboots when it inherits the group's MQTT broker.
      security:
        - BearerAuth: []
        - SessionCookie: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host, password]
              properties:
                host: { type: string, description: IP or hostname of a head on the target unit }
                password: { type: string, description: The group's admin password }
                token: { type: string, description: Setup claim token (when not signed in) }
      responses:
        '200':
          description: Joined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupJoinResult' }
        '400':
          description: 'Join refused; `error` is a user-facing message (wrong password, no password on the target, firmware too old, ...)'
        '401':
          description: Unauthorized
        '409':
          description: Already in a group
        '502':
          description: Target unreachable or sent an invalid reply
  /api/group/discover:
    get:
      tags: [Groups]
      summary: Heads to offer for joining
      description: |
        Same response as `/api/house`. Also allowed without signing in while the
        head is unclaimed (`t` = the setup claim token) or the reset window is
        open, so a new head can list the outdoor units it could join.
      security:
        - BearerAuth: []
        - SessionCookie: []
        - {}
      parameters:
        - { name: t, in: query, required: false, schema: { type: string }, description: Setup claim token }
      responses:
        '200':
          description: Same as `/api/house`
        '401':
          description: Unauthorized
  /api/group/leave:
    post:
      tags: [Groups]
      summary: Leave the current group
      security:
        - BearerAuth: []
        - SessionCookie: []
      responses:
        '200':
          description: Left
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: left }
        '500':
          description: NVS write failed
  /api/group/sync:
    post:
      tags: [Groups]
      summary: Apply a coordinated mode change from a peer (HMAC-signed)
      description: |
        Device-to-device. Authenticated by the `X-Group-*` HMAC headers; the
        response also carries an `X-Group-Sig` header.
      parameters:
        - { name: X-Group-Sender, in: header, required: true, schema: { type: string } }
        - { name: X-Group-Id, in: header, required: true, schema: { type: string } }
        - { name: X-Group-Nonce, in: header, required: true, schema: { type: string } }
        - { name: X-Group-Sig, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [op_id, target_mode, strategy]
              properties:
                op_id: { type: integer }
                target_mode: { type: string, enum: [HEAT, COOL] }
                strategy: { type: string, enum: [flip, off_conflicting] }
      responses:
        '200':
          description: Applied / aligned / stale / dwell result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupSyncResult' }
        '400':
          description: Invalid JSON, op_id or target_mode
        '401':
          description: Invalid sender, nonce, group id or signature
        '403':
          description: Not in a group
        '409':
          description: Time-slicing is enabled (mixed modes are scheduled, not switched)
        '500':
          description: Out of memory building the response
  /api/group/resolve:
    post:
      tags: [Groups]
      summary: Owner-initiated coordinated whole-group mode switch
      description: |
        Switches this head to `target_mode` and fans the op out to every peer.
        `off_conflicting` turns off peers on the opposite direction (allowed
        for the climate-only `user` role); `flip` switches them to
        `target_mode` (admin only, 403 otherwise).
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_mode]
              properties:
                target_mode: { type: string, enum: [HEAT, COOL] }
                strategy: { type: string, enum: [flip, off_conflicting] }
      responses:
        '200':
          description: Coordination result across self + peers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupResolveResult' }
        '400':
          description: Empty, oversized or invalid body, or bad target_mode
        '403':
          description: Not an admin and strategy is not `off_conflicting`
        '409':
          description: Time-slicing is enabled
  /api/group/label:
    post:
      tags: [Groups]
      summary: Rename the group
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string }
      responses:
        '200':
          description: Renamed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusOk' }
        '400':
          description: Empty, oversized or invalid body
        '409':
          description: Not in a group
        '500':
          description: NVS write failed
  /api/group/slice:
    post:
      tags: [Groups]
      summary: Configure Tandem (time-sliced heat/cool) for the group (admin)
      description: |
        Lets heads that share one outdoor unit take turns: the elected
        coordinator runs HEAT and COOL in alternating slices, and heads whose
        mode isn't being served are parked (held off) until their slice. The
        config replicates to every member. While enabled, AUTO is rejected and
        `/api/group/resolve` / `/api/group/sync` return 409. Off-at-setpoint
        is forced on for every head. Partial updates are allowed; values are
        clamped (min slice 300-3600 s, max slice >= min and <= 7200 s,
        settle 180-600 s).
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                min_slice_s: { type: integer, description: 'Minimum slice before switching to waiting heads (default 600)' }
                max_slice_s: { type: integer, description: 'Switch even if the current mode is unsatisfied (default 1800)' }
                settle_s: { type: integer, description: 'All-off pause between HEAT and COOL slices (default and minimum 180)' }
      responses:
        '200':
          description: Applied settings and live status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SliceStatus' }
        '400':
          description: Empty, oversized or invalid body
        '409':
          description: Not in a group, or enabling while a member is offline or doesn't support time-slicing
        '500':
          description: NVS write failed
  /api/group/member/remove:
    post:
      tags: [Groups]
      summary: Remove a member from the group by uid
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uid]
              properties:
                uid: { type: string }
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusOk' }
        '400':
          description: Empty/oversized/invalid body, bad uid, or cannot remove self (use leave)
        '409':
          description: Not in a group
        '500':
          description: NVS write failed
  /api/house:
    get:
      tags: [House]
      summary: Every HeatLink head on the LAN, across all outdoor units
      description: |
        Returns the last completed LAN scan immediately. Heads are discovered via
        the `_mmhvac._tcp` mDNS service and each one's `/api/house/summary` is
        fetched in the background. When the cache is older than ~15 s a rescan is
        started and `scanning` is true; poll again shortly. Heads are sectioned by
        `ghash` (outdoor-unit fingerprint, display-only). Read-only: changes are
        made by opening the target head's own UI.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - SessionCookie: []
      responses:
        '200':
          description: House view
          content:
            application/json:
              schema:
                type: object
                properties:
                  self: { $ref: '#/components/schemas/HouseSummary' }
                  heads:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/HouseSummary'
                        - type: object
                          properties:
                            reachable: { type: boolean, description: 'Head answered HTTP' }
                            summary_supported: { type: boolean, description: 'False for offline heads or firmware without /api/house/summary' }
                  scanning: { type: boolean }
                  age_s: { type: integer, description: 'Age of the scan result (absent before the first scan completes)' }
        '401':
          description: Unauthorized
  /api/house/summary:
    get:
      tags: [House]
      summary: Public read-only summary of this head (for the House view)
      description: |
        Unauthenticated by design so heads in other groups (and heads with web
        login enabled) can still appear in the House view. Exposes only name,
        outdoor-unit fingerprint/label and live mode/temperatures; nothing usable
        for control or group signing.
      security: []
      responses:
        '200':
          description: Head summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseSummary' }
  /api/info:
    get:
      tags: [Status]
      summary: Public identity, API version and sign-in methods
      description: |
        Unauthenticated, for discovery: an integration (e.g. Home Assistant via
        the `_mmhvac._tcp` mDNS record) uses it to recognise a HeatLink head,
        check `api_version` and see how to sign in before it has a token.
      security: []
      responses:
        '200':
          description: Head identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid: { type: string, description: 'Stable device id (MAC-derived)' }
                  name: { type: string }
                  hostname: { type: string }
                  model: { type: string, example: stamp-s3 }
                  fw: { type: string, example: 1.5.0 }
                  api_version: { type: integer, example: 1, description: 'Bumped on breaking REST API changes' }
                  pv: { type: integer, description: 'Group protocol version' }
                  auth:
                    type: object
                    properties:
                      state: { type: string, enum: [legacy, unclaimed, claimed] }
                      web_login: { type: boolean, description: 'Browser login is enforced' }
                      open_climate: { type: boolean, description: 'Climate control is open without signing in' }
                      api_key: { type: boolean, description: 'The legacy X-API-Key toggle is on' }
                      tokens: { type: boolean, description: 'Integration tokens are supported' }
                  features:
                    type: array
                    items: { type: string }
                    example: [tokens, events, history, park, room_sensors, group, tandem]
                  group:
                    type: object
                    description: Absent when the head is standalone
                    properties:
                      ghash: { type: string, description: 'Outdoor-unit fingerprint (8 hex)' }
                      label: { type: string }
  /api/tokens:
    get:
      tags: [Auth]
      summary: List integration tokens (admin)
      security:
        - BearerAuth: []
        - SessionCookie: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Tokens (the secret is never returned again)
          content:
            application/json:
              schema:
                type: object
                properties:
                  max: { type: integer, example: 8 }
                  tokens:
                    type: array
                    items: { $ref: '#/components/schemas/Token' }
        '401': { description: Unauthorized }
        '403': { description: Not an admin }
    post:
      tags: [Auth]
      summary: Create an integration token (admin)
      description: |
        Returns the token text once, in `token`; only a hash is stored. Send it
        as `Authorization: Bearer <token>`.
      security:
        - BearerAuth: []
        - SessionCookie: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, maxLength: 32, example: Home Assistant }
                scope: { type: string, enum: [read, control, admin], default: control }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Token'
                  - type: object
                    properties:
                      token: { type: string, example: hlt1_0a1b2c3d_00112233445566778899aabbccddeeff }
        '400': { description: Missing label or unknown scope }
        '401': { description: Unauthorized }
        '403': { description: Not an admin }
        '409': { description: All 8 token slots are in use }
    delete:
      tags: [Auth]
      summary: Revoke an integration token (admin)
      security:
        - BearerAuth: []
        - SessionCookie: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string, example: 0a1b2c3d }
      responses:
        '200': { description: Revoked }
        '401': { description: Unauthorized }
        '403': { description: Not an admin }
        '404': { description: No such token }
  /api/tokens/ticket:
    post:
      tags: [Auth]
      summary: Get a ticket for this token on another head of the outdoor unit
      description: |
        Integration tokens only (sessions and API keys get 403). Returns a
        one-time ticket, valid for 60 s, that the target head named by `uid`
        exchanges at `POST /api/tokens/redeem` for its own token with this
        token's name and scope. Heads must be in the same group with their
        clocks set.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uid]
              properties:
                uid: { type: string, description: Target head's uid (from its /api/info) }
      responses:
        '200':
          description: Ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { type: string }
                  label: { type: string, description: Pass back unchanged when redeeming }
                  scope: { type: string, enum: [read, control, admin] }
                  expires: { type: integer, description: Unix seconds }
        '401': { description: Bad token }
        '403': { description: Not an integration token }
        '404': { description: Target is not a member of this outdoor unit }
        '409': { description: This head is not in a group }
        '503': { description: Clock not set }
  /api/tokens/redeem:
    post:
      tags: [Auth]
      summary: Exchange a ticket from another head for a token on this one
      description: |
        No auth; the signed ticket is the proof. Creates a token with the
        ticket's name and scope, replacing any earlier token with the same
        name and no stronger scope so pairing again doesn't pile up copies.
        The token text is returned once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket, label]
              properties:
                ticket: { type: string }
                label: { type: string, description: The `label` returned with the ticket }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Token'
                  - type: object
                    properties:
                      token: { type: string }
        '401':
          description: Ticket malformed, for another head, expired, already used or badly signed
        '409': { description: All 8 token slots are in use }
        '429': { description: Locked after too many failed attempts }
  /api/remote-temp:
    post:
      tags: [Control]
      summary: Feed the unit a room temperature from an outside sensor
      description: |
        Starts or refreshes a lease. The unit uses `temp` instead of its own
        return-air sensor until the lease runs out, then goes back to its own
        sensor. Send again before `expires_in_s` reaches 0 to keep it going.
        `temp: null` ends the lease now. Refused while a paired room sensor
        is feeding this head. Needs control scope.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [temp]
              properties:
                temp: { type: number, nullable: true, minimum: 1, maximum: 40, description: Degrees C; null clears }
                ttl_s: { type: integer, minimum: 60, maximum: 3600, default: 600, description: Seconds; outside 60-3600 is a 400 }
      responses:
        '200':
          description: Lease state
          content:
            application/json:
              schema:
                type: object
                properties:
                  active: { type: boolean }
                  temp: { type: number }
                  expires_in_s: { type: integer }
        '400': { description: Bad JSON or temperature out of range }
        '401': { description: Not logged in }
        '403': { description: Token lacks control scope }
        '409': { description: A room sensor is feeding this head }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Integration token (`hlt1_<id>_<secret>`) created under Settings → API
        access or via POST /api/tokens. Accepted whether or not the X-API-Key
        toggle is on. Scope `read` allows GET requests, `control` adds climate
        control (like the climate-only login), `admin` allows everything. A
        token that is sent but invalid or revoked gets 401 even on endpoints
        that are otherwise open.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    SessionCookie:
      type: apiKey
      in: cookie
      name: mh_session
  schemas:
    Token:
      type: object
      properties:
        id: { type: string, description: '8 hex; public part of the token' }
        label: { type: string }
        scope: { type: string, enum: [read, control, admin] }
        created: { type: integer, nullable: true, description: 'Unix seconds; null if the clock was not set' }
        last_used: { type: integer, nullable: true, description: 'Unix seconds, updated at most daily in flash; null if never used' }
    HouseSummary:
      type: object
      properties:
        uid: { type: string }
        name: { type: string }
        ip: { type: string, description: 'Present on /api/house entries' }
        pv: { type: integer, description: 'Group protocol version' }
        version: { type: string }
        ghash: { type: string, description: 'Outdoor-unit fingerprint (8 hex); absent when standalone' }
        glabel: { type: string, description: 'Group label; absent when standalone' }
        unit_connected: { type: boolean }
        power: { type: string, description: 'Absent when no unit connected' }
        mode: { type: string }
        operating: { type: boolean }
        roomTemp: { type: number }
        targetTemp: { type: number }
        rs: { type: string, enum: [ok, stale], description: 'Wall room sensors: ok = roomTemp is their average, stale = none heard (unit sensor). Absent with none paired.' }
        freq: { type: integer, description: 'Compressor frequency in Hz (0 when idle); absent when no unit connected' }
    StatusOk:
      type: object
      properties:
        status: { type: string, example: ok }
    StartedStatus:
      type: object
      properties:
        status: { type: string, example: started }
    SavedRebooting:
      type: object
      properties:
        status: { type: string, example: saved }
        message: { type: string, example: rebooting }
    Status:
      type: object
      properties:
        version: { type: string }
        hostname: { type: string }
        name: { type: string, description: User-set display name }
        ip: { type: string }
        ssid: { type: string, description: SSID of the associated WiFi network }
        rssi: { type: integer, description: WiFi signal strength in dBm }
        tx_power_dbm: { type: integer, description: WiFi transmit-power cap currently applied, in dBm }
        tx_power_min_dbm: { type: integer, description: Minimum settable TX power (dBm) }
        tx_power_max_dbm: { type: integer, description: Maximum settable TX power (dBm) }
        unit_connected: { type: boolean }
        mqtt_connected: { type: boolean }
        mqtt_configured: { type: boolean, description: true once a broker host is stored (false on a fresh unconfigured unit) }
        uptime_s: { type: integer }
        free_heap: { type: integer }
        power:
          type: object
          properties:
            present: { type: boolean }
            vbat_mv: { type: integer }
            vin_mv: { type: integer }
            vinout_mv: { type: integer }
            input_mv: { type: integer }
            source: { type: string }
            charging: { type: boolean }
            battery_present: { type: boolean, description: 'Actively probed Li-ion cell presence (relaxation test + insert/remove IRQ tracking)' }
        diag:
          type: object
          description: Power/brownout diagnostics
          properties:
            boot_count: { type: integer }
            brownout_count: { type: integer }
            reset_reason: { type: string }
            last_was_brownout: { type: boolean }
            vin_min_mv: { type: integer }
            vin_min_ever_mv: { type: integer }
            vin_sag_count: { type: integer }
            wifi_drop_count: { type: integer, description: WiFi outages this session (RAM, resets on boot) }
            wifi_drops_24h: { type: integer, description: WiFi outages in the last 24 h of uptime (max 8) }
    Settings:
      type: object
      properties:
        power: { type: string, example: 'ON' }
        mode: { type: string, example: HEAT }
        temperature: { type: number }
        fan: { type: string }
        vane: { type: string }
        wideVane: { type: string }
        connected: { type: boolean }
        temp_unit: { type: string, enum: [C, F], description: Web UI display unit (Home Assistant stays in °C) }
        lang: { type: string, description: 'Persisted web UI language override ("" = auto-detect from browser, e.g. "en", "fr")' }
        caps: { $ref: '#/components/schemas/SettingsCaps' }
        roomTemperature: { type: number, description: Room temperature reported by the unit (the remote value while wall sensors are in use) }
        roomSensor:
          type: object
          description: Wall room sensors; absent when none is paired
          properties:
            state: { type: string, enum: [ok, stale] }
            temp: { type: number, nullable: true, description: Average of the fresh sensors }
            n_fresh: { type: integer }
            sensors:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  fresh: { type: boolean }
                  temp: { type: number, nullable: true }
                  age_s: { type: integer, nullable: true }
        operating: { type: boolean }
        compressorFrequency: { type: number }
        outsideTemp: { type: number, description: Only present when reported by the unit }
        runtimeHours: { type: number, description: Only present when reported by the unit }
        inputPowerW: { type: number, description: Only present when reported by the unit }
        energyKwh: { type: number, description: Only present when reported by the unit }
        targetHumidity: { type: number, description: Only present when reported by the unit }
        subMode: { type: string, description: Only present when reported by the unit }
        stage: { type: string, description: Only present when reported by the unit }
        direction:
          type: string
          enum: [HEAT, COOL]
          description: >-
            Direction the outdoor unit is currently running (CN105 0x09
            data[5]). Mainly useful in AUTO; absent when unknown or idle.
        errorCode: { type: string, description: Only present when reported by the unit }
        fault: { type: boolean, description: True when `errorCode` is set and isn't "No Error" }
        remoteTemp:
          type: object
          description: Present while an outside temperature feed is active
          properties:
            temp: { type: number }
            source: { type: string, description: 'api or mqtt' }
            by: { type: string, description: Who started the feed }
            age_s: { type: integer, description: Seconds since the last update }
            expires_in_s: { type: integer, nullable: true, description: null when it doesn't expire }
        park: { $ref: '#/components/schemas/ParkStatus' }
    ParkStatus:
      type: object
      description: Off-at-setpoint runtime status. While parked, `power` reports ON.
      properties:
        enabled: { type: boolean }
        state: { type: string, enum: [off, running, parked, probing] }
        parked: { type: boolean, description: Desired on but held off at setpoint }
        reason: { type: string, description: 'Why parked/probing, e.g. "setpoint reached", "scheduled probe"' }
        next_probe_s: { type: integer, nullable: true, description: Seconds until the next probe while parked, else null }
        unit_on: { type: boolean, description: Physical unit power (false while parked even though power reports ON) }
        satisfied: { type: boolean, description: Parked because the room reached its setpoint }
        held: { type: boolean, description: 'Held off waiting for its time slice (reason "waiting_for_slice")' }
        tandem: { type: string, enum: [heat, cool, switch], description: 'Only when held: what the other rooms are doing (switch = changing modes)' }
        tandem_eta_s: { type: integer, nullable: true, description: 'Only when held: estimated seconds until this room''s turn starts (rest of the pause between modes, or the latest the running turn can end plus that pause); null when unknown' }
        tandem_next: { type: string, enum: [heat, cool], description: 'Only when tandem_eta_s is set: the mode this room''s turn will run' }
        need: { type: string, enum: ['yes', 'no', checking], description: 'Only when held: does this room need its Tandem turn (checking until its air check reports; yes when checks are off)' }
        checking: { type: boolean, description: 'Only when held: an air check is running in FAN mode (settings report the user''s mode)' }
        forced: { type: boolean, description: Off-at-setpoint is forced on by group time-slicing }
        slicing: { type: boolean, description: Group time-slicing (Tandem) is enabled (AUTO is unavailable) }
        quiet_fan: { type: boolean, description: An air check is running with the fan at QUIET (settings report the user's fan) }
        room_sensor: { type: boolean, description: 'A fresh wireless room sensor supplies the room temperature, so no air checks run (next_probe_s is null)' }
    RoomSensors:
      type: object
      properties:
        active: { type: boolean, description: The sensors' temperature is being sent to the unit as its room temperature }
        temp: { type: number, nullable: true, description: Average of the fresh sensors, °C }
        n_fresh: { type: integer }
        max: { type: integer, description: Sensors allowed per head }
        sensors:
          type: array
          items:
            type: object
            properties:
              id: { type: string, description: 'Bluetooth address, or Shelly device id' }
              kind: { type: string, enum: [bthome, shelly] }
              name: { type: string }
              fresh: { type: boolean, description: A temperature was received within stale_after_s }
              temp: { type: number, nullable: true, description: °C }
              humidity: { type: number, nullable: true, description: '%RH' }
              battery: { type: integer, nullable: true, description: '%' }
              rssi: { type: integer, nullable: true, description: dBm }
              temp_age_s: { type: integer, nullable: true }
              seen_age_s: { type: integer, nullable: true }
              stale_after_s: { type: integer }
              host: { type: string, description: 'shelly: sensor IP' }
              report_step: { type: number, description: 'shelly: report threshold, °C' }
              pending: { type: boolean, description: 'shelly: webhooks/report step not yet applied (sensor asleep)' }
              sync_error: { type: string, description: 'shelly: last error applying them' }
        pairing:
          type: object
          properties:
            ble:
              type: object
              properties:
                open: { type: boolean }
                remaining_s: { type: integer }
                nearby:
                  type: array
                  description: BTHome devices heard during the window, strongest first
                  items:
                    type: object
                    properties:
                      addr: { type: string }
                      name: { type: string }
                      rssi: { type: integer }
                      encrypted: { type: boolean, description: Encrypted BTHome can't be decoded (not selectable) }
                      temp: { type: number, nullable: true }
                      age_s: { type: integer }
            wifi:
              type: object
              properties:
                open: { type: boolean }
                remaining_s: { type: integer }
                found:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      ip: { type: string }
                state: { type: string, enum: [idle, working, ok, error] }
                message: { type: string, description: 'Sensor name when ok; reason when error ("full" = already 4 sensors)' }
        ble:
          type: object
          properties:
            scanning: { type: boolean, description: Bluetooth is up and scanning }
            error: { type: string, description: Non-empty if the Bluetooth stack failed to start }
            adverts: { type: integer, description: 'Advertisements heard since boot from any device (diagnostics)' }
    ParkConfigUpdate:
      type: object
      properties:
        enabled: { type: boolean }
        delta_c: { type: number, description: Restart threshold past setpoint, °C }
        min_off_s: { type: integer, description: Minimum parked time before a drift restart }
        probe_enabled: { type: boolean }
        probe_interval_s: { type: integer, description: Parked time between probe runs }
        probe_duration_s: { type: integer, description: Airflow time per probe run }
    ParkConfig:
      allOf:
        - $ref: '#/components/schemas/ParkConfigUpdate'
        - type: object
          properties:
            shared:
              type: boolean
              description: In a zone group, so enable / min-off / probe settings are shared by all its heads
            status: { $ref: '#/components/schemas/ParkStatus' }
    SettingsUpdate:
      type: object
      properties:
        power: { type: string, enum: ['ON', 'OFF'] }
        mode: { type: string, example: HEAT }
        temperature: { type: number }
        fan: { type: string }
        vane: { type: string }
        wideVane: { type: string }
        remoteTemp: { type: number, description: External room temperature feed }
    MqttSettings:
      type: object
      properties:
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        base_topic: { type: string }
        friendly_name: { type: string }
        password_set: { type: boolean }
        connected: { type: boolean }
    MqttSettingsUpdate:
      type: object
      required: [host]
      properties:
        host: { type: string }
        port: { type: integer, default: 1883 }
        username: { type: string }
        password: { type: string, format: password }
        base_topic: { type: string }
        friendly_name: { type: string }
    WifiSettings:
      type: object
      properties:
        ssid: { type: string }
        mode: { type: string, enum: [connected, connecting, provisioning, idle] }
        connected: { type: boolean }
        ip: { type: string }
        ap_name: { type: string }
        password_set: { type: boolean }
    WifiUpdate:
      type: object
      required: [ssid]
      properties:
        ssid: { type: string }
        password: { type: string, format: password }
    UpdateInfo:
      type: object
      properties:
        current: { type: string }
        latest: { type: string }
        update_available: { type: boolean }
        checking: { type: boolean }
        checked: { type: boolean }
        published_at: { type: string }
        release_url: { type: string }
        error: { type: string }
        last_trigger: { type: string }
        last_requester: { type: string }
        last_check_age_s: { type: integer }
    OtaStatus:
      type: object
      properties:
        state: { type: string, enum: [idle, in_progress, success, failed] }
        progress: { type: integer }
        message: { type: string }
        busy: { type: boolean }
    AuthState:
      type: object
      properties:
        state:
          type: string
          enum: [legacy, unclaimed, claimed]
          description: |
            `legacy` = no admin password, UI open; `unclaimed` = no admin
            password, locked until claimed; `claimed` = admin password set.
        recovery_secs_left:
          type: integer
          description: Seconds left to set a new admin password without logging in, after the reset procedure (0 = none).
        web_auth_enabled:
          type: boolean
          description: Derived — true when an admin password is set or a claim is pending.
        api_auth_enabled: { type: boolean }
        username: { type: string }
        web_password_set: { type: boolean }
        user_password_set: { type: boolean }
        role: { type: string, enum: [admin, user, none] }
        token_scope: { type: string, enum: [read, control, admin], description: 'Present when the request used an integration token (role is then admin for an admin token, user otherwise)' }
        authenticated: { type: boolean, description: True for any role other than `none`, including a guest. }
        open_climate:
          type: boolean
          description: Claimed with no climate-only password set; clients without a session get the climate-only `user` role.
        guest: { type: boolean, description: This client has the `user` role through open climate control (no session). }
        user_limits:
          type: object
          description: Setpoint range allowed for the climate-only `user` role (admin and API key are not limited). Per head.
          properties:
            enabled: { type: boolean }
            min: { type: number, description: °C, 16-31 in 0.5 steps }
            max: { type: number, description: °C, 16-31 in 0.5 steps, not below `min` }
        power_reset:
          type: boolean
          description: Whether the power-cut procedure can reset the admin password (default true). The Home Assistant reset button always works. Per head.
        api_key:
          type: string
          description: Only present when the client is authenticated.
    AuthUpdate:
      type: object
      properties:
        username: { type: string }
        password: { type: string, format: password }
        user_password: { type: string, format: password }
        remove_user: { type: boolean }
        user_limits:
          type: object
          description: Admin only. Setpoint range allowed for the climate-only `user` role (admin and API key are not limited). Per head.
          properties:
            enabled: { type: boolean }
            min: { type: number, description: °C, 16-31 in 0.5 steps }
            max: { type: number, description: °C, 16-31 in 0.5 steps, not below `min` }
        power_reset:
          type: boolean
          description: Admin only. Whether the power-cut procedure can reset the admin password (default true). The Home Assistant reset button always works. Per head.
        claim:
          type: boolean
          description: Create the first admin password (see description).
        token:
          type: string
          description: Claim token from the setup portal link.
        api_auth_enabled: { type: boolean }
        regenerate_key: { type: boolean }
    AuthPostResult:
      type: object
      properties:
        status: { type: string, example: ok }
        role:
          type: string
          description: "`admin` when this request claimed the head."
        web_auth_enabled: { type: boolean }
        api_auth_enabled: { type: boolean }
        username: { type: string }
        api_key:
          type: string
          description: Only present when regenerated in this request.
    WideVaneCap:
      type: object
      properties:
        detected: { type: string, enum: [unknown, supported, unsupported, inconclusive] }
        override: { type: string, enum: [auto, show, hide] }
        detecting: { type: boolean, description: True while a detection probe is running }
        show: { type: boolean, description: Whether the UI should show the wide-vane control }
    SettingsCaps:
      type: object
      properties:
        wideVane: { $ref: '#/components/schemas/WideVaneCap' }
    Capabilities:
      type: object
      properties:
        wideVane: { $ref: '#/components/schemas/WideVaneCap' }
        unit_connected: { type: boolean }
        unit_on: { type: boolean }
    CapabilitiesUpdate:
      type: object
      properties:
        wideVane:
          type: object
          properties:
            override: { type: string, enum: [auto, show, hide] }
            detect: { type: boolean, description: Run an on-demand detection probe }
    DeviceUpdate:
      type: object
      properties:
        name: { type: string, description: Device display name }
        temp_unit: { type: string, enum: [C, F] }
        tx_power: { type: integer, description: 'WiFi transmit-power cap in dBm (clamped to tx_power_min_dbm..tx_power_max_dbm from /api/status); applied live, no reboot' }
        lang: { type: string, description: 'Web UI language override ("" = auto-detect from browser, e.g. "en", "fr"); applied live, no reboot' }
    DeviceResult:
      type: object
      properties:
        name: { type: string }
        temp_unit: { type: string, enum: [C, F] }
        tx_power_dbm: { type: integer, description: TX-power cap in effect after the update (dBm) }
        lang: { type: string, description: Web UI language override in effect after the update }
    WifiNetwork:
      type: object
      properties:
        ssid: { type: string }
        rssi: { type: integer, description: Signal strength in dBm }
        auth: { type: integer, description: esp_wifi authmode enum (0 = open) }
    Event:
      type: object
      properties:
        seq: { type: integer, description: Monotonic sequence id }
        ts: { type: integer, description: Unix epoch seconds; 0 until the clock syncs }
        up: { type: integer, description: Uptime in milliseconds when logged }
        cat:
          type: integer
          description: >-
            Category: 0 Mode, 1 Power, 2 Setpoint, 3 Fan, 4 Group, 5 Membership,
            6 Ota, 7 Net, 8 Unit, 9 Fault, 10 System.
        act:
          type: integer
          description: 'Actor: 0 System, 1 WebUI, 2 HomeAssistant, 3 Group, 4 Local.'
        msg: { type: string }
        name: { type: string, description: Username or peer name; omitted for system events }
        ip: { type: string, description: IPv4 address of the web UI / API client that made the change; omitted otherwise }
    EventsResponse:
      type: object
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        now_epoch: { type: integer }
        clock_valid: { type: boolean }
        seq: { type: integer, description: Current high-water sequence id }
    GroupMember:
      type: object
      properties:
        uid: { type: string }
        name: { type: string }
        state: { type: string, enum: [known, incompatible, unknown] }
        configured_demand: { type: string, description: Present when state is known }
        mode: { type: string }
        roomTemp: { type: number }
        targetTemp: { type: number }
        rs: { type: string, enum: [ok, stale], description: 'Wall room sensors: ok = roomTemp is their average, stale = none heard (unit sensor). Absent with none paired.' }
        ip: { type: string }
    GroupSelf:
      type: object
      properties:
        uid: { type: string }
        name: { type: string }
        configured_demand: { type: string }
        operating: { type: boolean }
        standby: { type: boolean }
        mode: { type: string }
        roomTemp: { type: number }
        targetTemp: { type: number }
        rs: { type: string, enum: [ok, stale], description: 'Wall room sensors: ok = roomTemp is their average, stale = none heard (unit sensor). Absent with none paired.' }
        ip: { type: string }
    GroupConflict:
      type: object
      properties:
        uid: { type: string }
        name: { type: string }
        wants: { type: string }
    GroupView:
      type: object
      properties:
        group_id: { type: string }
        group_label: { type: string }
        in_group: { type: boolean }
        protocol_version: { type: integer }
        self: { $ref: '#/components/schemas/GroupSelf' }
        members:
          type: array
          items: { $ref: '#/components/schemas/GroupMember' }
        member_count: { type: integer }
        status: { type: string, description: 'e.g. ok, conflict, indeterminate' }
        locked_mode: { type: string, nullable: true }
        locked_by: { type: string }
        conflicts:
          type: array
          items: { $ref: '#/components/schemas/GroupConflict' }
        unknown_members:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }
        slice: { $ref: '#/components/schemas/SliceStatus' }
    SliceStatus:
      type: object
      description: Group time-slicing settings and live schedule.
      properties:
        enabled: { type: boolean }
        min_slice_s: { type: integer }
        max_slice_s: { type: integer }
        settle_s: { type: integer }
        available: { type: boolean, description: Every member is online and supports time-slicing }
        active: { type: boolean, description: A slice schedule is in force }
        mode: { type: string, nullable: true, enum: [none, heat, cool, null] }
        phase: { type: string, nullable: true, enum: [idle, run, changeover, null] }
        elapsed_s: { type: integer, nullable: true, description: Seconds in the current phase }
        decide_s: { type: integer, nullable: true, description: 'Run: elapsed seconds at which the turn is next reconsidered (the max turn, pushed out while waiting rooms don''t need theirs)' }
        coordinator: { type: string, description: Elected coordinator uid (empty if none) }
        is_coordinator: { type: boolean }
        members:
          type: array
          items:
            type: object
            properties:
              uid: { type: string }
              fresh: { type: boolean }
              capable: { type: boolean }
              wants: { type: string, enum: [none, heat, cool] }
              need: { type: string, enum: ['yes', 'no', checking], description: 'While waiting: does its room need a turn (checking until its air check reports; yes when checks are off or older firmware)' }
              directive: { type: string, enum: [free, run, hold] }
    GroupJoinResult:
      type: object
      properties:
        status: { type: string, example: joined }
        group_id: { type: string }
        group_label: { type: string }
        member_count: { type: integer }
        broker_inherited:
          type: boolean
          description: true when the owner's broker settings were adopted (this head had none of its own).
        rebooting:
          type: boolean
          description: true when the device is restarting to apply an inherited broker.
    GroupSyncResult:
      type: object
      properties:
        uid: { type: string }
        op_id: { type: integer }
        applied: { type: boolean }
        reason: { type: string, enum: [applied, aligned, stale, dwell] }
        pv: { type: integer }
    GroupResolveResult:
      type: object
      properties:
        status: { type: string, enum: [ok, partial] }
        op_id: { type: integer }
        target_mode: { type: string }
        strategy: { type: string }
        self:
          type: object
          properties:
            uid: { type: string }
            result: { type: string }
        results:
          type: array
          items:
            type: object
            properties:
              uid: { type: string }
              result: { type: string }